<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подтверждение аккаунта — Галерея Муси и Кети</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 20%, #161b22 0%, #0d1117 80%, #06090d 100%);
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .confirm-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }
    .confirm-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #f59e0b, #58a6ff, #10b981);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 12px;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    h1 {
      color: #f59e0b;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .subtitle {
      color: #8b949e;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
    }
    p {
      color: #c9d1d9;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #238636;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s, transform 0.1s;
      text-decoration: none;
    }
    .btn:hover { background: #2ea043; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled {
      background: #30363d;
      color: #8b949e;
      cursor: not-allowed;
      transform: none;
    }
    .status-msg {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .status-msg.success {
      background: rgba(46, 160, 67, 0.15);
      border: 1px solid #2ea043;
      color: #3fb950;
    }
    .status-msg.error {
      background: rgba(248, 81, 73, 0.15);
      border: 1px solid #f85149;
      color: #f85149;
    }
    .footer-note {
      margin-top: 24px;
      color: #6e7681;
      font-size: 12px;
    }
    .footer-note a { color: #58a6ff; text-decoration: none; }
    .footer-note a:hover { text-decoration: underline; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="confirm-card">
    <div class="icon">🐾</div>
    <h1>Галерея Муси и Кети</h1>
    <div class="subtitle">Активация аккаунта</div>
    <p id="descText">
      Нажмите кнопку ниже, чтобы завершить подтверждение почты и активировать доступ к играм и рейтингам:
    </p>

    <button id="btnConfirm" class="btn">
      <span>Подтвердить аккаунт</span>
    </button>

    <div id="statusBox" class="status-msg"></div>

    <div class="footer-note">
      Хранительницы архива — Муся и Кети.<br>
      <a href="battleship.html">Вернуться в Морской бой</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hxdwavbtjhxbyfcimctz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_uWgTHdlA9dZeOQhgaL36Nw_GgVH5LvI';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const btn = document.getElementById('btnConfirm');
    const statusBox = document.getElementById('statusBox');
    const descText = document.getElementById('descText');

    // Extract token_hash and type from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const tokenHash = urlParams.get('token_hash');
    const type = urlParams.get('type') || 'signup';

    if (!tokenHash) {
      descText.textContent = 'Ссылка не содержит токена подтверждения или уже была использована.';
      btn.style.display = 'none';
      statusBox.className = 'status-msg error';
      statusBox.style.display = 'block';
      statusBox.textContent = 'Не найден токен подтверждения. Попробуйте войти в аккаунт или зарегистрироваться снова.';
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = '⏳ Подтверждение...';
      statusBox.style.display = 'none';

      try {
        const { data, error } = await sb.auth.verifyOtp({
          token_hash: tokenHash,
          type: type
        });

        if (error) throw error;

        statusBox.className = 'status-msg success';
        statusBox.style.display = 'block';
        statusBox.textContent = '🎉 Аккаунт успешно активирован! Перенаправляем в игру...';
        btn.textContent = '✓ Подтверждено';

        setTimeout(() => {
          window.location.href = 'battleship.html';
        }, 1200);
      } catch (err) {
        statusBox.className = 'status-msg error';
        statusBox.style.display = 'block';
        statusBox.textContent = 'Ошибка: ' + (err.message || 'Не удалось подтвердить аккаунт');
        btn.disabled = false;
        btn.textContent = 'Попробовать снова';
      }
    });
  </script>

</body>
</html>
